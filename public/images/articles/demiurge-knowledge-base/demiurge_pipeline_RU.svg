ze="31" font-weight="400" fill="#17202a">status = pending</text><rect x="55" y="392" width="520" height="200" rx="14" fill="#eef5f5" stroke="#8fa3b4" stroke-width="2"/><text x="315.0" y="447" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#17202a">6  База мира</text><text x="315.0" y="498" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Сущности · связи · правила</text><text x="315.0" y="540" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">proposal = applied</text><rect x="640" y="392" width="520" height="200" rx="14" fill="#f4f7fa" stroke="#8fa3b4" stroke-width="2"/><text x="900.0" y="447" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#17202a">5  Применение</text><text x="900.0" y="498" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Повторная проверка</text><text x="900.0" y="540" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Записи и статус · один commit</text><rect x="1225" y="392" width="520" height="200" rx="14" fill="#f4f7fa" stroke="#8fa3b4" stroke-width="2"/><text x="1485.0" y="447" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#17202a">4  Проверка мастером</text><text x="1485.0" y="498" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Просмотр и правка</text><text x="1485.0" y="540" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Удаление лишних элементов</text><path d="M581 195 L627 195" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><path d="M1166 195 L1212 195" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><path d="M1485 307 L1485 378" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><p