<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#475569" stroke-width="1.6"/></marker></defs><text x="55" y="44" text-anchor="start" font-family="DejaVu Sans" font-size="30" font-weight="600" fill="#17202a">From source text to the world database</text><rect x="55" y="95" width="520" height="200" rx="14" fill="#f4f7fa" stroke="#8fa3b4" stroke-width="2"/><text x="315.0" y="150" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#17202a">1  Source text</text><text x="315.0" y="201" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Model response</text><text x="315.0" y="243" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">or notes</text><rect x="640" y="95" width="520" height="200" rx="14" fill="#f4f7fa" stroke="#8fa3b4" stroke-width="2"/><text x="900.0" y="150" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#17202a">2  Extraction</text><text x="900.0" y="201" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">World context · JSON</text><text x="900.0" y="243" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Parsing and schema checks</text><rect x="1225" y="95" width="520" height="200" rx="14" fill="#eef5f5" stroke="#8fa3b4" stroke-width="2"/><text x="1485.0" y="150" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#17202a">3  Proposal</text><text x="1485.0" y="201" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">source_text + payload</text><text x="1485.0" y="243" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">status = pending</text><rect x="55" y="392" width="520" height="200" rx="14" fill="#eef5f5" stroke="#8fa3b4" stroke-width="2"/><text x="315.0" y="447" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#17202a">6  World database</text><text x="315.0" y="498" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Entities · relationships · rules</text><text x="315.0" y="540" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">proposal = applied</text><rect x="640" y="392" width="520" height="200" rx="14" fill="#f4f7fa" stroke="#8fa3b4" stroke-width="2"/><text x="900.0" y="447" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#17202a">5  Application</text><text x="900.0" y="498" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Validation again</text><text x="900.0" y="540" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Writes and status · one commit</text><rect x="1225" y="392" width="520" height="200" rx="14" fill="#f4f7fa" stroke="#8fa3b4" stroke-width="2"/><text x="1485.0" y="447" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="600" fill="#17202a">4  Human review</text><text x="1485.0" y="498" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Read and edit</text><text x="1485.0" y="540" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Remove unwanted items</text><path d="M581 195 L627 195" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><path d="M1166 195 L1212 195" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><path d="M1485 307 L1485 378" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><path d="M1213 492 L1166 492" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><path d="M628 492 L581 492" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="900" y="667" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#17202a">Proposal status and item verification status are stored separately</text></svg>